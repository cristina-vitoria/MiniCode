[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode-agent"
version = "0.1.0"
description = "Agente de programação com especificação, hard gates e repair loop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
minicode = "minicode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
